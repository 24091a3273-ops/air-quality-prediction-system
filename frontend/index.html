<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Air Quality Prediction System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>🌍 Air Quality Prediction System</h1>
        <p>Machine Learning Based AQI Prediction & Health Alert System</p>
    </header>

    <div class="card">

        <h2>Enter Air Quality Data</h2>

        <div class="form-grid">

            <div class="input-box">
                <label>CO</label>
                <input type="number" id="CO" step="any" placeholder="Example: 2.0">
            </div>

            <div class="input-box">
                <label>NOx</label>
                <input type="number" id="NOx" step="any" placeholder="Example: 150">
            </div>

            <div class="input-box">
                <label>NO₂</label>
                <input type="number" id="NO2" step="any" placeholder="Example: 80">
            </div>

            <div class="input-box">
                <label>Benzene (C₆H₆)</label>
                <input type="number" id="C6H6" step="any" placeholder="Example: 5">
            </div>

            <div class="input-box">
                <label>Temperature (°C)</label>
                <input type="number" id="temperature" step="any" placeholder="Example: 20">
            </div>

            <div class="input-box">
                <label>Humidity (%)</label>
                <input type="number" id="humidity" step="any" placeholder="Example: 50">
            </div>

            <div class="input-box">
                <label>Absolute Humidity</label>
                <input type="number" id="AH" step="any" placeholder="Example: 1.0">
            </div>

        </div>

        <button onclick="predictAQI()">🔍 Predict AQI</button>

        <button class="reset-btn" onclick="resetForm()">↻ Reset</button>

    </div>


    <!-- RESULT -->

    <div id="result" class="result hidden">

        <h2>Predicted Air Quality Index</h2>

        <div id="aqiValue">--</div>

        <div id="category">--</div>

        <div id="healthAlert">
            --
        </div>

    </div>


    <!-- AQI INFORMATION -->

    <div class="info-card">

        <h2>AQI Health Information</h2>

        <div class="aqi-table">

            <div>0 – 50</div>
            <div>Good</div>

            <div>51 – 100</div>
            <div>Satisfactory</div>

            <div>101 – 200</div>
            <div>Moderate</div>

            <div>201 – 300</div>
            <div>Poor</div>

            <div>301 – 400</div>
            <div>Very Poor</div>

            <div>401 – 500</div>
            <div>Severe</div>

        </div>

    </div>

</div>


<script>

async function predictAQI() {

    const data = {

        CO: parseFloat(document.getElementById("CO").value),

        NOx: parseFloat(document.getElementById("NOx").value),

        NO2: parseFloat(document.getElementById("NO2").value),

        C6H6: parseFloat(document.getElementById("C6H6").value),

        temperature: parseFloat(
            document.getElementById("temperature").value
        ),

        humidity: parseFloat(
            document.getElementById("humidity").value
        ),

        AH: parseFloat(
            document.getElementById("AH").value
        )
    };


    if (Object.values(data).some(value => isNaN(value))) {

        alert("Please enter all values.");

        return;
    }


    try {

        const response = await fetch(
            "/predict",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );


        const result = await response.json();


        document
            .getElementById("result")
            .classList.remove("hidden");


        document.getElementById("aqiValue").innerText =
            result.AQI;


        document.getElementById("category").innerText =
            result.category;


        showHealthAlert(result.AQI);


        setAQIColor(result.AQI);

    }

    catch (error) {

        alert(
            "Unable to connect to the prediction server. Make sure Flask is running."
        );

        console.error(error);

    }

}


function setAQIColor(aqi) {

    const resultBox =
        document.getElementById("result");

    if (aqi <= 50) {

        resultBox.className = "result good";

    }

    else if (aqi <= 100) {

        resultBox.className = "result satisfactory";

    }

    else if (aqi <= 200) {

        resultBox.className = "result moderate";

    }

    else if (aqi <= 300) {

        resultBox.className = "result poor";

    }

    else if (aqi <= 400) {

        resultBox.className = "result very-poor";

    }

    else {

        resultBox.className = "result severe";

    }

}


function showHealthAlert(aqi) {

    const alertBox =
        document.getElementById("healthAlert");


    if (aqi <= 50) {

        alertBox.innerText =
            "Air quality is good. Enjoy outdoor activities.";

    }

    else if (aqi <= 100) {

        alertBox.innerText =
            "Air quality is satisfactory. Sensitive people should take care.";

    }

    else if (aqi <= 200) {

        alertBox.innerText =
            "Moderate air pollution. Consider reducing prolonged outdoor activity.";

    }

    else if (aqi <= 300) {

        alertBox.innerText =
            "Poor air quality. Avoid prolonged outdoor exposure.";

    }

    else if (aqi <= 400) {

        alertBox.innerText =
            "Very poor air quality. Limit outdoor activities.";

    }

    else {

        alertBox.innerText =
            "Severe air pollution. Avoid outdoor exposure and take precautions.";

    }

}


function resetForm() {

    document
        .querySelectorAll("input")
        .forEach(input => input.value = "");


    document
        .getElementById("result")
        .className = "result hidden";

}

</script>

</body>
</html>
